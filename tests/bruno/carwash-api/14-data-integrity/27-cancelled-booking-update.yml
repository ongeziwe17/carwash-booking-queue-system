info:
  name: Cancelled booking cannot be updated
  type: http
  seq: 27
  tags:
    - integrity

http:
  method: PUT
  url: "{{baseUrl}}/api/bookings/{{cancelBookingId}}"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "vehicleId": "{{customerVehicleId}}",
        "serviceId": "{{serviceId}}",
        "scheduledDateTime": "{{future18}}",
        "specialRequest": "denied"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns HTTP 400", function() { expect(res.status).to.equal(400); });
        test("uses BUSINESS_RULE_VIOLATION", function() { expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); expect(res.body.status).to.equal(400); });
        test("reports request path", function() { expect(res.body.path).to.equal(new URL(req.getUrl()).pathname); });
        test("has ISO timestamp and fieldErrors", function() { expect(Number.isNaN(Date.parse(res.body.timestamp))).to.equal(false); expect(Array.isArray(res.body.fieldErrors)).to.equal(true); });
        test("uses safe business message", function() { expect(res.body.message).to.include("current state"); });
        const payload = JSON.stringify(res.body ?? {});
        const lower = payload.toLowerCase();
        for (const forbidden of ["encodedpassword", "passwordhash", "stacktrace", "java.lang", "authorization", "secure_jwt_secret", "bootstrap-admin-password"]) {
          expect(lower, `response leaked ${forbidden}`).to.not.include(forbidden);
        }
        const rawPassword = bru.interpolate("{{process.env.BRUNO_TEST_USER_PASSWORD}}");
        if (rawPassword && !rawPassword.includes("process.env")) expect(payload).to.not.include(rawPassword);
        const bootstrapPassword = bru.interpolate("{{process.env.BRUNO_BOOTSTRAP_ADMIN_PASSWORD}}");
        if (bootstrapPassword && !bootstrapPassword.includes("process.env")) expect(payload).to.not.include(bootstrapPassword);
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
