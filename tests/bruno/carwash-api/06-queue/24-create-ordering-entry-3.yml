info:
  name: Server appends third queue entry
  type: http
  seq: 24
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "queueEntryId": "{{queueOrderingEntry3Id}}",
        "bookingId": "{{queueOrderingBooking3Id}}",
        "serviceId": "{{queueOrderingService15Id}}"
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });
        test("third entry gets cumulative wait", function() { expect(res.body.position).to.equal(Number(bru.getVar("queueOrderingStartPosition")) + 2); expect(res.body.estimatedWaitMin).to.equal(Number(bru.getVar("queueOrderingBaselineWait")) + 35); expect(res.body.queueStatus).to.equal("WAITING"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
