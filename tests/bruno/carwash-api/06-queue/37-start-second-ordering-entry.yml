info:
  name: Start second ordering entry
  type: http
  seq: 37
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry2Id}}/start"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("entry is in progress", function() { expect(res.body.queueStatus).to.equal("IN_PROGRESS"); expect(res.body.booking.status).to.equal("IN_SERVICE"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
