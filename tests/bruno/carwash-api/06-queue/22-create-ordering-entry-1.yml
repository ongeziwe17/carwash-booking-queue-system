info:
  name: Server appends first queue entry
  type: http
  seq: 22
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "queueEntryId": "{{queueOrderingEntry1Id}}",
        "bookingId": "{{queueOrderingBooking1Id}}",
        "serviceId": "{{queueOrderingService10Id}}"
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });
        const startPosition = Number(res.body.position);
        const baselineWait = Number(res.body.estimatedWaitMin);
        bru.setVar("queueOrderingStartPosition", startPosition);
        bru.setVar("queueOrderingBaselineWait", baselineWait);
        bru.setVar("queueOrderingBeyondActivePosition", startPosition + 2);
        test("first workflow entry appends with server metrics", function() { expect(startPosition).to.be.greaterThan(0); expect(baselineWait).to.be.at.least(0); expect(res.body.queueStatus).to.equal("WAITING"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
