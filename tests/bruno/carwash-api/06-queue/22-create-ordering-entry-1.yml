info:
  name: Server appends first queue entry
  type: http
  seq: 22
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "queueEntryId": "{{queueOrderingEntry1Id}}",
        "bookingId": "{{queueOrderingBooking1Id}}",
        "serviceId": "{{queueOrderingService10Id}}"
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });
        test("first entry gets position 1 and wait 0", function() { expect(res.body.position).to.equal(1); expect(res.body.estimatedWaitMin).to.equal(0); expect(res.body.queueStatus).to.equal("WAITING"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
