info:
  name: Call next selects first waiting ordering entry
  type: http
  seq: 30
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/call-next"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("lowest-position waiting entry is called", function() {
          expect(res.body.queueEntryId).to.equal(bru.getVar("queueOrderingEntry3Id"));
          expect(res.body.queueStatus).to.equal("CALLED");
          expect(res.body.booking.status).to.equal("CONFIRMED");
          expect(res.body.position).to.equal(Number(bru.getVar("queueOrderingStartPosition")));
          expect(res.body.estimatedWaitMin).to.equal(Number(bru.getVar("queueOrderingBaselineWait")));
        });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
