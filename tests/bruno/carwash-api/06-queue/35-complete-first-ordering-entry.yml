info:
  name: Complete first ordering entry
  type: http
  seq: 38
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry3Id}}/complete"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("completed entry has no active wait", function() { expect(res.body.queueStatus).to.equal("COMPLETED"); expect(res.body.estimatedWaitMin).to.equal(0); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
