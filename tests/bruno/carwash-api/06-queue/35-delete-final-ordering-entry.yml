info:
  name: Delete final waiting ordering entry
  type: http
  seq: 35
  tags:
    - workflow
    - integrity

http:
  method: DELETE
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry2Id}}"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 204", function() { expect(res.status).to.equal(204); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
