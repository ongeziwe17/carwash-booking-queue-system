info:
  name: Verify terminal entries do not contribute to wait
  type: http
  seq: 39
  tags:
    - workflow
    - integrity

http:
  method: GET
  url: "{{baseUrl}}/api/queue-entries"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("remaining workflow entry closes the workflow gap", function() {
          const active = res.body.content.filter(entry => ["WAITING", "CALLED", "IN_PROGRESS"].includes(entry.queueStatus));
          const remaining = active.find(entry => entry.queueEntryId === bru.getVar("queueOrderingEntry2Id"));
          expect(remaining.position).to.equal(Number(bru.getVar("queueOrderingStartPosition")));
          expect(remaining.estimatedWaitMin).to.equal(Number(bru.getVar("queueOrderingBaselineWait")));
          const completed = res.body.content.find(entry => entry.queueEntryId === bru.getVar("queueOrderingEntry3Id"));
          expect(completed.queueStatus).to.equal("COMPLETED");
          expect(completed.estimatedWaitMin).to.equal(0);
        });
        test("active entries precede terminal history", function() {
          expect(["WAITING", "CALLED", "IN_PROGRESS"]).to.include(res.body.content[0].queueStatus);
        });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

        test("bounded page envelope", function() {
          expect(res.body.content).to.be.an("array");
          expect(res.body.page).to.be.at.least(0);
          expect(res.body.size).to.be.within(1, 100);
          expect(res.body.content.length).to.be.at.most(res.body.size);
          expect(res.body.totalElements).to.be.at.least(res.body.content.length);
          expect(res.body.totalPages).to.equal(Math.ceil(res.body.totalElements / res.body.size));
          expect(res.body.hasNext).to.equal(res.body.page + 1 < res.body.totalPages);
          expect(res.body.hasPrevious).to.equal(res.body.page > 0);
        });
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
