info:
  name: Verify terminal entries do not contribute to wait
  type: http
  seq: 33
  tags:
    - workflow
    - integrity

http:
  method: GET
  url: "{{baseUrl}}/api/queue-entries"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("remaining active entry moves to first with no wait", function() {
          const active = res.body.filter(entry => ["WAITING", "CALLED", "IN_PROGRESS"].includes(entry.queueStatus));
          expect(active[0].queueEntryId).to.equal(bru.getVar("queueOrderingEntry2Id"));
          expect(active[0].position).to.equal(1);
          expect(active[0].estimatedWaitMin).to.equal(0);
          const completed = res.body.find(entry => entry.queueEntryId === bru.getVar("queueOrderingEntry3Id"));
          expect(completed.queueStatus).to.equal("COMPLETED");
          expect(completed.estimatedWaitMin).to.equal(0);
        });
        test("active entries precede terminal history", function() {
          expect(["WAITING", "CALLED", "IN_PROGRESS"]).to.include(res.body[0].queueStatus);
        });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
