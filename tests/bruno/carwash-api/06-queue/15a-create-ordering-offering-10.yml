info:
  name: Create 10-minute ordering offering
  type: http
  seq: 16
  tags: [queue, offering, ordering]
http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{opsBranchId}}/offerings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: '{"offeringId":"{{queueOrderingOffering10Id}}","serviceId":"{{queueOrderingService10Id}}","price":10.00,"estimatedDurationMin":10,"concurrentCapacity":1}'
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns 201", function() { expect(res.status).to.equal(201); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
