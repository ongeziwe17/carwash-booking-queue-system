info:
  name: Reject manual position beyond active queue size
  type: http
  seq: 32
  tags:
    - workflow
    - integrity

http:
  method: PUT
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry2Id}}/position"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "position": {{queueOrderingBeyondActivePosition}}
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", function() { expect(res.status).to.equal(400); });
        test("uses queue size business rule", function() { expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); expect(res.body.message).to.equal("Queue position exceeds active queue size"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
