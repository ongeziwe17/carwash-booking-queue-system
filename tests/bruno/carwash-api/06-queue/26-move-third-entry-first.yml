info:
  name: Move third waiting entry to first
  type: http
  seq: 26
  tags:
    - workflow
    - integrity

http:
  method: PUT
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry3Id}}/position"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "position": 1
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("moved entry is first with no wait", function() { expect(res.body.position).to.equal(1); expect(res.body.estimatedWaitMin).to.equal(0); expect(res.body.queueStatus).to.equal("WAITING"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
