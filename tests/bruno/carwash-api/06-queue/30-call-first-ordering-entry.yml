info:
  name: Call first ordering entry by ID
  type: http
  seq: 30
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/{{queueOrderingEntry3Id}}/call-next"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("specified entry is called", function() { expect(res.body.queueEntryId).to.equal(bru.getVar("queueOrderingEntry3Id")); expect(res.body.queueStatus).to.equal("CALLED"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
