info:
  name: Confirm second ordering booking
  type: http
  seq: 20
  tags:
    - workflow
    - integrity

http:
  method: POST
  url: "{{baseUrl}}/api/bookings/{{queueOrderingBooking2Id}}/confirm"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("booking is confirmed", function() { expect(res.body.status).to.equal("CONFIRMED"); });
        test("does not expose access tokens", function() { expect(JSON.stringify(res.body ?? {}).toLowerCase()).to.not.include("accesstoken"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
