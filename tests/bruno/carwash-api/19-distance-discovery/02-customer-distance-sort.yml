info: { name: Customer sorts nearby branches by raw distance, type: http, seq: 2, tags: [discovery, geo, sort] }
http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/discoverable/nearby?latitude=-33.908&longitude=18.42&sort=distance"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("origin branch precedes the more distant branch", function() { const ids = res.body.map(b => b.branchId); expect(ids.indexOf(bru.getVar("marketplaceBranchId"))).to.be.lessThan(ids.indexOf(bru.getVar("marketplaceSecondBranchId"))); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
