info: { name: Radius filter uses inclusive raw distance, type: http, seq: 3, tags: [discovery, geo, radius] }
http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/discoverable/nearby?latitude=-33.908&longitude=18.42&radiusKm=1"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("includes zero-distance branch and excludes branch outside radius", function() { const ids = res.body.map(b => b.branchId); expect(ids).to.include(bru.getVar("marketplaceBranchId")); expect(ids).to.not.include(bru.getVar("marketplaceSecondBranchId")); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
