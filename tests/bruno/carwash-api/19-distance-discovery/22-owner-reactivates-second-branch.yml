info: { name: Owner restores second branch after visibility workflow, type: http, seq: 22, tags: [discovery, lifecycle, owner, workflow] }
http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceSecondBranchId}}/activate"
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: 'test("returns 200", function() { expect(res.status).to.equal(200); expect(res.body.discoverable).to.equal(true); });'
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
