info: { name: Service filter uses discoverable branch offerings, type: http, seq: 4, tags: [discovery, offering, service] }
http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/discoverable/nearby?latitude=-33.908&longitude=18.42&serviceId={{serviceId}}"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("includes both branches with effective discoverable offerings", function() { const ids = res.body.map(b => b.branchId); expect(ids).to.include(bru.getVar("marketplaceBranchId")); expect(ids).to.include(bru.getVar("marketplaceSecondBranchId")); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
