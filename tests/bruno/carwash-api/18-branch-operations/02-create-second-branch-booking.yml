info:
  name: Create booking at second Marketplace branch
  type: http
  seq: 2
  tags: [ops, booking, branch, workflow]
http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {"bookingId":"{{branchOpsSecondBookingId}}","userId":"{{customerUserId}}","vehicleId":"{{customerVehicleId}}","branchId":"{{marketplaceSecondBranchId}}","serviceOfferingId":"{{marketplaceSecondOfferingId}}","scheduledDateTime":"{{future48}}","specialRequest":"second branch operation"}
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201 at same time in independent branch", function() { expect(res.status).to.equal(201); });
        test("uses second branch terms", function() { expect(res.body.branchId).to.equal(bru.getVar("marketplaceSecondBranchId")); expect(res.body.serviceOfferingId).to.equal(bru.getVar("marketplaceSecondOfferingId")); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
