info: { name: Queue consistency mismatch is rejected, type: http, seq: 12, tags: [ops, queue, integrity] }
http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries"
  headers: [{ name: Content-Type, value: "application/json" }]
  body: { type: json, data: '{"queueEntryId":"{{branchOpsMismatchQueueId}}","bookingId":"{{branchOpsFirstBookingId}}","serviceId":"{{inactiveServiceId}}"}' }
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("rejects client service mismatch", function() { expect(res.status).to.equal(400); expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); expect(res.body.message).to.include("match"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
