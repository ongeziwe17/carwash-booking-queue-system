info: { name: First branch queue is unaffected, type: http, seq: 9, tags: [ops, queue, branch, workflow] }
http:
  method: GET
  url: "{{baseUrl}}/api/queue-entries?branchId={{marketplaceBranchId}}"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("contains no second branch records", function() { expect(res.status).to.equal(200); expect(res.body.some(q => q.queueEntryId === bru.getVar("branchOpsFirstQueueId") && q.queueStatus === "WAITING")).to.equal(true); expect(res.body.every(q => q.branchId === bru.getVar("marketplaceBranchId"))).to.equal(true); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
