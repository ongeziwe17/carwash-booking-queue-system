info: { name: Unknown booking offering is rejected, type: http, seq: 15, tags: [ops, booking, integrity] }
http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body: { type: json, data: '{"bookingId":"branch-ops-unknown-offering-{{runId}}","userId":"{{customerUserId}}","vehicleId":"{{customerVehicleId}}","branchId":"{{marketplaceBranchId}}","serviceOfferingId":"missing-offering-{{runId}}","scheduledDateTime":"{{future47}}"}' }
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns standard 404", function() { expect(res.status).to.equal(404); expect(res.body.code).to.equal("RESOURCE_NOT_FOUND"); expect(res.body.message).to.include("Offering not found"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
