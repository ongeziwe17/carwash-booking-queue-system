info: { name: Confirm first branch booking, type: http, seq: 4, tags: [ops, booking, workflow] }
http:
  method: POST
  url: "{{baseUrl}}/api/bookings/{{branchOpsFirstBookingId}}/confirm"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns CONFIRMED", function() { expect(res.status).to.equal(200); expect(res.body.status).to.equal("CONFIRMED"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
