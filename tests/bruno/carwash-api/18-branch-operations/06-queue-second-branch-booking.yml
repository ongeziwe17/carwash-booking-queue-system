info: { name: Queue second branch booking, type: http, seq: 8, tags: [ops, queue, branch, workflow] }
http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries"
  headers: [{ name: Content-Type, value: "application/json" }]
  body: { type: json, data: '{"queueEntryId":"{{branchOpsSecondQueueId}}","bookingId":"{{branchOpsSecondBookingId}}","serviceId":"{{serviceId}}"}' }
  auth: { type: bearer, token: "{{adminToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("second branch independently starts at position one", function() { expect(res.status).to.equal(201); expect(res.body.branchId).to.equal(bru.getVar("marketplaceSecondBranchId")); expect(res.body.serviceOfferingId).to.equal(bru.getVar("marketplaceSecondOfferingId")); expect(res.body.position).to.equal(1); expect(res.body.estimatedWaitMin).to.equal(0); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
