info: { name: Cross-branch booking offering update is rejected, type: http, seq: 11, tags: [ops, booking, integrity] }
http:
  method: PUT
  url: "{{baseUrl}}/api/bookings/{{branchOpsFirstBookingId}}"
  headers: [{ name: Content-Type, value: "application/json" }]
  body: { type: json, data: '{"vehicleId":"{{customerVehicleId}}","serviceOfferingId":"{{marketplaceSecondOfferingId}}","specialRequest":"cannot move branch"}' }
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("rejects cross-branch offering", function() { expect(res.status).to.equal(400); expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); expect(res.body.message).to.include("does not belong"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
