info: { name: Call next only in second branch, type: http, seq: 8, tags: [ops, queue, branch, workflow] }
http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/call-next?branchId={{marketplaceSecondBranchId}}"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("selects only second branch entry", function() { expect(res.status).to.equal(200); expect(res.body.queueEntryId).to.equal(bru.getVar("branchOpsSecondQueueId")); expect(res.body.branchId).to.equal(bru.getVar("marketplaceSecondBranchId")); expect(res.body.queueStatus).to.equal("CALLED"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
