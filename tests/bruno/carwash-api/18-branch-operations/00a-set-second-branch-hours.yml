info:
  name: Configure second branch for operational bookings
  type: http
  seq: 1
  tags: [ops, booking, branch, availability]
http:
  method: PUT
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceSecondBranchId}}/operating-hours"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {"intervals":[
        {"dayOfWeek":"MONDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"TUESDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"WEDNESDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"THURSDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"FRIDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"SATURDAY","opensAt":"08:00:00","closesAt":"17:00:00"},
        {"dayOfWeek":"SUNDAY","opensAt":"08:00:00","closesAt":"17:00:00"}
      ]}
  auth: { type: bearer, token: "{{adminToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("second branch is operational all week", function() { expect(res.status).to.equal(200); expect(res.body.intervals).to.have.length(7); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
