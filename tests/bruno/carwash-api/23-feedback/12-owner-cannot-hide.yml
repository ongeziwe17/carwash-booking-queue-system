info: { name: 12 owner cannot hide, type: http, seq: 12, tags: [feedback, verification] }
http:
  method: POST
  url: "{{baseUrl}}/api/feedback/reviews/{{bookingId}}/hide"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {"reason":"No"}
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 403", function() { expect(res.status).to.equal(403); });
        test("stable error schema", function() { expect(res.body.code).to.equal("ACCESS_DENIED"); expect(res.body.path).to.include("/api/feedback/"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
