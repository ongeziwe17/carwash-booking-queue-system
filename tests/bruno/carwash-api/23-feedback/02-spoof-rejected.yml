info: { name: 02 spoof rejected, type: http, seq: 2, tags: [feedback, verification] }
http:
  method: POST
  url: "{{baseUrl}}/api/feedback/reviews"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {"bookingId":"{{bookingId}}","rating":5,"businessId":"other"}
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function() { expect(res.status).to.equal(400); });
        test("stable error schema", function() { expect(res.body.code).to.equal("MALFORMED_REQUEST"); expect(res.body.path).to.include("/api/feedback/"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
