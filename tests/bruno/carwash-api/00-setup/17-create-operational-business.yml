info:
  name: Create run-scoped operational business
  type: http
  seq: 7
  tags: [setup, operations, marketplace]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/businesses"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {
        "businessId": "{{opsBusinessId}}",
        "businessName": "Bruno Operations Group",
        "contactEmail": "ops-{{runId}}@example.test",
        "contactPhone": "+27 82 555 0100",
        "registrationNumber": "OPS-{{runId}}"
      }
  auth: { type: bearer, token: "{{adminToken}}" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });
        test("creates active operational business", function() { expect(res.body.businessId).to.equal(bru.getVar("opsBusinessId")); expect(res.body.status).to.equal("ACTIVE"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
