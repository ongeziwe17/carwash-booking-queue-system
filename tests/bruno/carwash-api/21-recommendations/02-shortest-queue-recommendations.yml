info: { name: Customer requests shortest queue recommendations, type: http, seq: 2, tags: [recommendation, customer, ranking, queue] }
http:
  method: GET
  url: "{{baseUrl}}/api/recommendations/branches?latitude=-33.9249&longitude=18.4241&serviceId={{serviceId}}&at={{future47}}Z&preference=SHORTEST_QUEUE"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("keeps the identical eligible candidate set", function() { expect(JSON.stringify(res.body.map(item => item.branchId).sort())).to.equal(bru.getVar("recommendationCandidateIds")); });
        test("keeps unknown queue values null and explained", function() { expect(res.body[0].appliedPreference).to.equal("SHORTEST_QUEUE"); expect(res.body[0].queueWaitEstimateMin).to.equal(null); expect(res.body[0].scoreBreakdown.queueWait.available).to.equal(false); expect(res.body[0].scoreBreakdown.queueWait.normalizedScore).to.equal(0); expect(res.body[0].explanation).to.include("unavailable"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
