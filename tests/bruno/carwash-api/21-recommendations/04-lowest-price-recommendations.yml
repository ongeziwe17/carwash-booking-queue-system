info: { name: Customer requests lowest price recommendations, type: http, seq: 4, tags: [recommendation, customer, ranking, price] }
http:
  method: GET
  url: "{{baseUrl}}/api/recommendations/branches?latitude=-33.9249&longitude=18.4241&serviceId={{serviceId}}&at={{future47}}Z&preference=LOWEST_PRICE"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("keeps the identical eligible candidate set", function() { expect(JSON.stringify(res.body.map(item => item.branchId).sort())).to.equal(bru.getVar("recommendationCandidateIds")); });
        test("returns price objective and explanation", function() { expect(res.body[0].appliedPreference).to.equal("LOWEST_PRICE"); expect(res.body[0].scoreBreakdown.price.available).to.equal(true); expect(res.body[0].explanation).to.include("price"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
