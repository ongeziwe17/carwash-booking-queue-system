info: { name: Customer requests best overall recommendations, type: http, seq: 5, tags: [recommendation, customer, ranking, overall] }
http:
  method: GET
  url: "{{baseUrl}}/api/recommendations/branches?latitude=-33.9249&longitude=18.4241&serviceId={{serviceId}}&at={{future47}}Z&preference=BEST_OVERALL"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("keeps the identical eligible candidate set", function() { expect(JSON.stringify(res.body.content.map(item => item.branchId).sort())).to.equal(bru.getVar("recommendationCandidateIds")); });
        test("weighted contributions reconcile exactly", function() { const item = res.body.content[0]; const b = item.scoreBreakdown; const sum = b.distance.weightedContribution + b.queueWait.weightedContribution + b.totalTime.weightedContribution + b.price.weightedContribution; expect(Number(sum.toFixed(6))).to.equal(item.recommendationScore); expect(item.appliedPreference).to.equal("BEST_OVERALL"); expect(item.explanation).to.include("Weighted balance"); });
        test("bounded page envelope", function() {
          expect(res.body.content).to.be.an("array");
          expect(res.body.page).to.be.at.least(0);
          expect(res.body.size).to.be.within(1, 100);
          expect(res.body.content.length).to.be.at.most(res.body.size);
          expect(res.body.totalElements).to.be.at.least(res.body.content.length);
          expect(res.body.totalPages).to.equal(Math.ceil(res.body.totalElements / res.body.size));
          expect(res.body.hasNext).to.equal(res.body.page + 1 < res.body.totalPages);
          expect(res.body.hasPrevious).to.equal(res.body.page > 0);
        });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
