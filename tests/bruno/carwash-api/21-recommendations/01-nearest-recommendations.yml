info:
  name: Customer requests nearest recommendations
  type: http
  seq: 1
  tags: [recommendation, customer, ranking, nearest]
http:
  method: GET
  url: "{{baseUrl}}/api/recommendations/branches?latitude=-33.9249&longitude=18.4241&serviceId={{serviceId}}&at={{future47}}Z&preference=NEAREST"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("returns ranked customer-safe explanations", function() {
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.greaterThan(1);
          expect(res.body[0].rank).to.equal(1);
          expect(res.body[0].appliedPreference).to.equal("NEAREST");
          expect(res.body[0].businessId).to.be.a("string");
          expect(res.body[0].businessName).to.be.a("string");
          expect(res.body[0].branchId).to.be.a("string");
          expect(res.body[0].serviceOfferingId).to.be.a("string");
          expect(res.body[0].distanceKm).to.be.a("number");
          expect(res.body[0].recommendationScore).to.be.a("number");
          expect(res.body[0].scoreBreakdown.distance.normalizedScore).to.be.a("number");
          expect(res.body[0].scoreBreakdown.distance.configuredWeight).to.equal(0.25);
          expect(res.body[0].explanation).to.include("distance");
          expect(res.body[0].reason).to.equal(undefined);
          expect(res.body[0].effectiveActive).to.equal(undefined);
          expect(res.body[0].repository).to.equal(undefined);
        });
        test("nearest uses raw distance and stable ordering", function() {
          const ids = res.body.map(item => item.branchId);
          expect(ids.indexOf(bru.getVar("marketplaceBranchId"))).to.be.lessThan(ids.indexOf(bru.getVar("marketplaceSecondBranchId")));
          bru.setVar("recommendationCandidateIds", JSON.stringify([...ids].sort()));
        });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
