info: { name: Staff re-authenticates after tenant reassignment, type: http, seq: 7, tags: [auth, tenant, security] }
http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers: [{ name: Content-Type, value: application/json }]
  body:
    type: json
    data: |-
      {
        "email": "{{staffEmail}}",
        "password": "{{process.env.BRUNO_TEST_USER_PASSWORD}}"
      }
  auth: { type: none }
runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200 && res.body.accessToken) bru.setVar("staffToken", res.body.accessToken);
    - type: tests
      code: test("issues a fresh staff token", function() { expect(res.status).to.equal(200); expect(res.body.user.roleName).to.equal("STAFF"); expect(res.body.accessToken).to.be.a("string").and.not.empty; });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
