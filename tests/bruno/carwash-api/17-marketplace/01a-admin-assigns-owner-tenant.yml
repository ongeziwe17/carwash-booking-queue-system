info:
  name: Platform admin assigns owner to Marketplace tenant
  type: http
  seq: 2
  tags: [marketplace, admin, tenant, security]

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/users/{{ownerUserId}}/tenant-membership"
  headers: [{ name: Content-Type, value: application/json }]
  body:
    type: json
    data: |-
      {
        "businessId": "{{marketplaceBusinessId}}"
      }
  auth: { type: bearer, token: "{{adminToken}}" }

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("staleOwnerToken", bru.getVar("ownerToken"));
    - type: tests
      code: |-
        test("assigns exactly one owner tenant", function() {
          expect(res.status).to.equal(200);
          expect(res.body.userId).to.equal(bru.getVar("ownerUserId"));
          expect(res.body.businessId).to.equal(bru.getVar("marketplaceBusinessId"));
          expect(res.body.assignedAt).to.be.a("string");
        });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
