info:
  name: Business owner retrieves Marketplace business
  type: http
  seq: 9
  tags: [marketplace, owner]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/businesses/{{marketplaceBusinessId}}"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns requested business", function() { expect(res.status).to.equal(200); expect(res.body.businessId).to.equal(bru.getVar("marketplaceBusinessId")); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
