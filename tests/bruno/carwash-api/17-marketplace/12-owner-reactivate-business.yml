info:
  name: Business owner reactivates Marketplace business
  type: http
  seq: 18
  tags: [marketplace, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/businesses/{{marketplaceBusinessId}}/activate"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("reactivates business", function() { expect(res.status).to.equal(200); expect(res.body.status).to.equal("ACTIVE"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
