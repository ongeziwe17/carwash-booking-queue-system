info:
  name: Customer reads open branch status
  type: http
  seq: 21
  tags: [marketplace, customer, workflow]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/open-status?at=2030-01-07T08:00:00Z"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("uses the branch timezone and weekly hours", function() { expect(res.body.timezone).to.equal("Africa/Johannesburg"); expect(res.body.branchLocalDateTime).to.include("+02:00"); expect(res.body.effectiveActive).to.equal(true); expect(res.body.withinWeeklyHours).to.equal(true); expect(res.body.temporarilyClosed).to.equal(false); expect(res.body.open).to.equal(true); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
