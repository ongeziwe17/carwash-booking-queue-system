info:
  name: Business owner creates temporary branch closure
  type: http
  seq: 22
  tags: [marketplace, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/closures"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "closureId": "{{marketplaceClosureId}}",
        "startAt": "2030-01-07T07:30:00Z",
        "endAt": "2030-01-07T08:30:00Z",
        "reason": "Planned water maintenance"
      }
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });
        test("creates an active bounded closure", function() { expect(res.body.closureId).to.equal(bru.getVar("marketplaceClosureId")); expect(res.body.branchId).to.equal(bru.getVar("marketplaceBranchId")); expect(res.body.status).to.equal("ACTIVE"); expect(res.body.reason).to.equal("Planned water maintenance"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
