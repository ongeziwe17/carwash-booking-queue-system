info:
  name: Invalid offering duration is rejected
  type: http
  seq: 51
  tags: [marketplace, offering, validation]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/offerings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "offeringId": "{{marketplaceInvalidOfferingId}}",
        "serviceId": "{{serviceId}}",
        "price": 100.00,
        "estimatedDurationMin": 0,
        "concurrentCapacity": 2
      }
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400 validation error", function() { expect(res.status).to.equal(400); expect(res.body.code).to.equal("VALIDATION_FAILED"); });
        test("identifies estimated duration", function() { expect(JSON.stringify(res.body.fieldErrors)).to.include("estimatedDurationMin"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

