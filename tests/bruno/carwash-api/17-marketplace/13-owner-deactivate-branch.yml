info:
  name: Business owner deactivates Marketplace branch
  type: http
  seq: 13
  tags: [marketplace, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/deactivate"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deactivates branch", function() { expect(res.status).to.equal(200); expect(res.body.status).to.equal("INACTIVE"); expect(res.body.discoverable).to.equal(false); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
