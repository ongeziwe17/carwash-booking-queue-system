info:
  name: Business owner reactivates offering parent branch
  type: http
  seq: 62
  tags: [marketplace, offering, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/activate"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("branch becomes active again", function() { expect(res.body.status).to.equal("ACTIVE"); expect(res.body.effectiveActive).to.equal(true); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

