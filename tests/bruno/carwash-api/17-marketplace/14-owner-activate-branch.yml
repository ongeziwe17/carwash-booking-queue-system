info:
  name: Business owner activates Marketplace branch
  type: http
  seq: 20
  tags: [marketplace, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/activate"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("activates branch", function() { expect(res.status).to.equal(200); expect(res.body.status).to.equal("ACTIVE"); expect(res.body.discoverable).to.equal(true); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
