info:
  name: Business owner disables offering branch discovery
  type: http
  seq: 64
  tags: [marketplace, offering, owner, workflow]

http:
  method: PUT
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "branchName": "Updated Bruno Branch",
        "addressLine1": "2 Dock Road",
        "addressLine2": "Unit 5",
        "city": "Cape Town",
        "province": "Western Cape",
        "postalCode": "8001",
        "countryCode": "ZA",
        "latitude": -33.908,
        "longitude": 18.42,
        "timezone": "Africa/Johannesburg",
        "publicDiscoveryEnabled": false
      }
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("branch stays active but opts out of discovery", function() { expect(res.body.status).to.equal("ACTIVE"); expect(res.body.effectiveActive).to.equal(true); expect(res.body.publicDiscoveryEnabled).to.equal(false); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

