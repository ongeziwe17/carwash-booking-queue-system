info:
  name: Temporary closure makes branch closed
  type: http
  seq: 23
  tags: [marketplace, customer, workflow]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/open-status?at=2030-01-07T08:00:00Z"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("active closure overrides normal hours", function() { expect(res.body.withinWeeklyHours).to.equal(true); expect(res.body.temporarilyClosed).to.equal(true); expect(res.body.open).to.equal(false); expect(res.body.applicableClosureId).to.equal(bru.getVar("marketplaceClosureId")); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
