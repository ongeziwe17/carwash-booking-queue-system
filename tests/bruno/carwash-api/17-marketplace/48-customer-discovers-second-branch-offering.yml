info:
  name: Customer discovers independently priced second branch offering
  type: http
  seq: 48
  tags: [marketplace, offering, customer, workflow]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceSecondBranchId}}/offerings/discoverable"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("second branch keeps independent terms", function() { expect(res.body).to.have.length(1); expect(res.body[0].serviceId).to.equal(bru.getVar("serviceId")); expect(res.body[0].price).to.equal(189.99); expect(res.body[0].estimatedDurationMin).to.equal(60); expect(res.body[0].concurrentCapacity).to.equal(6); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

