info:
  name: Customer cannot manage Marketplace businesses
  type: http
  seq: 21
  tags: [marketplace, customer, rbac, security]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/businesses"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
