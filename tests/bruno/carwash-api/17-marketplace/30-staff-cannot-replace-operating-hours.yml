info:
  name: Staff cannot replace operating hours
  type: http
  seq: 36
  tags: [marketplace, staff, rbac, security]

http:
  method: PUT
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/operating-hours"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      { "intervals": [] }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
