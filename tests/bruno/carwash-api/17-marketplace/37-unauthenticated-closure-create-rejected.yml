info:
  name: Unauthenticated closure creation is rejected
  type: http
  seq: 43
  tags: [marketplace, auth, security]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/closures"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "closureId": "{{marketplaceUnauthClosureId}}",
        "startAt": "2030-01-08T08:00:00Z",
        "endAt": "2030-01-08T09:00:00Z",
        "reason": "Unauthenticated request"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 401", function() { expect(res.status).to.equal(401); expect(res.body.code).to.equal("AUTHENTICATION_REQUIRED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
