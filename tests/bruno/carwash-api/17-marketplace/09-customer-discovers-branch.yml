info:
  name: Customer discovers active public branch
  type: http
  seq: 15
  tags: [marketplace, customer, rbac, workflow]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/discoverable"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("contains a discovery-safe active branch", function() { const branch = res.body.find(b => b.branchId === bru.getVar("marketplaceBranchId")); expect(branch).to.not.equal(undefined); expect(branch).to.not.have.property("discoverable"); expect(branch).to.not.have.property("businessId"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
