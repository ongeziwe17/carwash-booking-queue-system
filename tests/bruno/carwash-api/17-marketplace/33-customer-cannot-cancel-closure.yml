info:
  name: Customer cannot cancel temporary closure
  type: http
  seq: 39
  tags: [marketplace, customer, rbac, security]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/closures/{{marketplaceClosureId}}/cancel"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
