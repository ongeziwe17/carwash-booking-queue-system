info:
  name: Customer discovers first branch offering
  type: http
  seq: 47
  tags: [marketplace, offering, customer, workflow]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/offerings/discoverable"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("returns customer-facing updated terms", function() { expect(res.body).to.have.length(1); expect(res.body[0].offeringId).to.equal(bru.getVar("marketplaceOfferingId")); expect(res.body[0].price).to.equal(149.99); expect(res.body[0].concurrentCapacity).to.equal(4); });
        test("omits management and object graph fields", function() { const item=res.body[0]; for (const field of ["status","effectiveActive","discoverable","createdAt","updatedAt","service","branch","repository"]) expect(item).to.not.have.property(field); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
