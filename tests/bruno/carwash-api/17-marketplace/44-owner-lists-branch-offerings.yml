info:
  name: Business owner lists branch offerings
  type: http
  seq: 44
  tags: [marketplace, offering, owner]

http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/offerings"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("returns deterministic bounded management records", function() { expect(res.body).to.be.an("array").with.length(1); expect(res.body[0].offeringId).to.equal(bru.getVar("marketplaceOfferingId")); expect(res.body[0]).to.not.have.property("service"); expect(res.body[0]).to.not.have.property("branch"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
