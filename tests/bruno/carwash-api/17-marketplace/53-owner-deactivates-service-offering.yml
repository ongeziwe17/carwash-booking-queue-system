info:
  name: Business owner deactivates branch service offering
  type: http
  seq: 53
  tags: [marketplace, offering, owner, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/offerings/{{marketplaceOfferingId}}/deactivate"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("stored offering becomes inactive and ineffective", function() { expect(res.body.status).to.equal("INACTIVE"); expect(res.body.effectiveActive).to.equal(false); expect(res.body.discoverable).to.equal(false); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

