info:
  name: Customer cannot create offering
  type: http
  seq: 70
  tags: [marketplace, offering, customer, rbac, security]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/offerings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {"offeringId":"{{marketplaceDeniedOfferingId}}","serviceId":"{{serviceId}}","price":10.00,"estimatedDurationMin":10,"concurrentCapacity":1}
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }

