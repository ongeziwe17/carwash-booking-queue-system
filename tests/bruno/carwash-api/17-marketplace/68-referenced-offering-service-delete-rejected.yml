info:
  name: Referenced offering service cannot be deleted
  type: http
  seq: 68
  tags: [marketplace, offering, integrity, owner]

http:
  method: DELETE
  url: "{{baseUrl}}/api/services/{{serviceId}}"
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", function() { expect(res.status).to.equal(400); });
        test("instructs deactivation instead of deletion", function() { expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); expect(res.body.message).to.include("branch offering"); expect(res.body.message).to.include("deactivate"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
