info:
  name: Staff cannot create temporary closure
  type: http
  seq: 32
  tags: [marketplace, staff, rbac, security]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{marketplaceBranchId}}/closures"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "closureId": "{{marketplaceUnauthorizedClosureId}}",
        "startAt": "2030-01-08T08:00:00Z",
        "endAt": "2030-01-08T09:00:00Z",
        "reason": "Denied request"
      }
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
