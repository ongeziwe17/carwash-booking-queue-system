info:
  name: Business owner updates branch service offering terms
  type: http
  seq: 46
  tags: [marketplace, offering, owner, workflow]

http:
  method: PUT
  url: "{{baseUrl}}/api/marketplace/offerings/{{marketplaceOfferingId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "price": 149.99,
        "estimatedDurationMin": 50,
        "concurrentCapacity": 4
      }
  auth:
    type: bearer
    token: "{{ownerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() { expect(res.status).to.equal(200); });
        test("updates terms without changing identity", function() { expect(res.body.offeringId).to.equal(bru.getVar("marketplaceOfferingId")); expect(res.body.branchId).to.equal(bru.getVar("marketplaceBranchId")); expect(res.body.serviceId).to.equal(bru.getVar("serviceId")); expect(res.body.price).to.equal(149.99); expect(res.body.estimatedDurationMin).to.equal(50); expect(res.body.concurrentCapacity).to.equal(4); expect(res.body.status).to.equal("ACTIVE"); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
