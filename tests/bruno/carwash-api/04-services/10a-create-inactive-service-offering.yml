info:
  name: Create offering before reusable service deactivation
  type: http
  seq: 12
  tags: [owner, integrity, operations, offering]

http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{opsBranchId}}/offerings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {
        "offeringId": "{{inactiveOfferingId}}",
        "serviceId": "{{inactiveServiceId}}",
        "price": 80.00,
        "estimatedDurationMin": 30,
        "concurrentCapacity": 1
      }
  auth: { type: bearer, token: "{{ownerToken}}" }

runtime:
  scripts:
    - type: tests
      code: test("returns 201", function() { expect(res.status).to.equal(201); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
