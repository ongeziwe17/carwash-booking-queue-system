info: { name: Business owner cannot override audit tenant, type: http, seq: 2, tags: [audit, tenant, security] }
http:
  method: GET
  url: "{{baseUrl}}/api/audit-records?businessId={{marketplaceSecondBusinessId}}"
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("owner tenant override returns 403", function() { expect(res.status).to.equal(403); });
        test("override failure is safe", function() { expect(JSON.stringify(res.body).toLowerCase()).to.not.include("audit_records"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
