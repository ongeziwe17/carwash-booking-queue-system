info:
  name: Waiting queue entry is removed by cancellation
  type: http
  seq: 9
  tags:
    - workflow
    - staff
    - integrity

http:
  method: GET
  url: "{{baseUrl}}/api/queue-entries/{{workflowCancelWaitingQueueId}}"
  auth:
    type: bearer
    token: "{{staffToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns HTTP 404", function() { expect(res.status).to.equal(404); });
        test("uses RESOURCE_NOT_FOUND", function() { expect(res.body.code).to.equal("RESOURCE_NOT_FOUND"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
