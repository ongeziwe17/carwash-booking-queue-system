info:
  name: Create booking for another service in target slot
  type: http
  seq: 8
  tags: [availability, workflow]

http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "bookingId": "{{availabilityBookingId}}",
        "userId": "{{customerUserId}}",
        "vehicleId": "{{customerVehicleId}}",
        "branchId": "{{opsBranchId}}",
        "serviceOfferingId": "{{availabilityOtherOfferingId}}",
        "scheduledDateTime": "{{availabilitySlot}}",
        "specialRequest": "global capacity fixture"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201", function() { expect(res.status).to.equal(201); });

settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
