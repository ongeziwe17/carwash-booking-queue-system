info:
  name: Create branch offering for availability service
  type: http
  seq: 4
  tags: [availability, workflow, offering]
http:
  method: POST
  url: "{{baseUrl}}/api/marketplace/branches/{{opsBranchId}}/offerings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: '{"offeringId":"{{availabilityOfferingId}}","serviceId":"{{availabilityServiceId}}","price":180.00,"estimatedDurationMin":60,"concurrentCapacity":2}'
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns 201", function() { expect(res.status).to.equal(201); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
