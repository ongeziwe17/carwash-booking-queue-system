info:
  name: Start lifecycle reschedule service
  type: http
  seq: 23
  tags: [workflow, staff]
http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/{{rescheduleLifecycleQueueId}}/start"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns IN_PROGRESS and IN_SERVICE", function() { expect(res.status).to.equal(200); expect(res.body.queueStatus).to.equal("IN_PROGRESS"); expect(res.body.booking.status).to.equal("IN_SERVICE"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
