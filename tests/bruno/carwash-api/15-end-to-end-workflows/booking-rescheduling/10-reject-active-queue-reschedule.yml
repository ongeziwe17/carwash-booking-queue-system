info:
  name: Reschedule rejects active queued booking
  type: http
  seq: 10
  tags: [workflow, customer, integrity]
http:
  method: POST
  url: "{{baseUrl}}/api/bookings/{{rescheduleQueuedBookingId}}/reschedule"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: '{ "scheduledDateTime": "{{future39}}" }'
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", function() { expect(res.status).to.equal(400); });
        test("reports active queue rule", function() { expect(res.body.message).to.equal("Booking cannot be rescheduled while it has an active queue entry"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
