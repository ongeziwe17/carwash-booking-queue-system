info:
  name: Reactivate dedicated reschedule service
  type: http
  seq: 17
  tags: [workflow, owner]
http:
  method: POST
  url: "{{baseUrl}}/api/services/{{rescheduleServiceId}}/activate"
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns active service", function() { expect(res.status).to.equal(200); expect(res.body.active).to.equal(true); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
