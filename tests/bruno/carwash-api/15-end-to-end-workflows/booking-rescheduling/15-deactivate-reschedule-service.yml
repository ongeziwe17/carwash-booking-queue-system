info:
  name: Deactivate associated reschedule service
  type: http
  seq: 16
  tags: [workflow, owner]
http:
  method: POST
  url: "{{baseUrl}}/api/services/{{rescheduleServiceId}}/deactivate"
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns inactive service", function() { expect(res.status).to.equal(200); expect(res.body.active).to.equal(false); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
