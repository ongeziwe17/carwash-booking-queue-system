info:
  name: Create booking for service lifecycle reschedule rejection
  type: http
  seq: 19
  tags: [workflow, customer]
http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {
        "bookingId": "{{rescheduleLifecycleBookingId}}",
        "userId": "{{customerUserId}}",
        "vehicleId": "{{customerVehicleId}}",
        "branchId": "{{opsBranchId}}",
        "serviceOfferingId": "{{rescheduleOfferingId}}",
        "scheduledDateTime": "{{future43}}",
        "specialRequest": "service lifecycle reschedule"
      }
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns 201", function() { expect(res.status).to.equal(201); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
