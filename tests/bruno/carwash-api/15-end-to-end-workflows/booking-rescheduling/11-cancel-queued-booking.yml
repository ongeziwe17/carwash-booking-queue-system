info:
  name: Cancel queued reschedule fixture
  type: http
  seq: 11
  tags: [workflow, customer]
http:
  method: POST
  url: "{{baseUrl}}/api/bookings/{{rescheduleQueuedBookingId}}/cancel"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns cancelled booking", function() { expect(res.status).to.equal(200); expect(res.body.status).to.equal("CANCELLED"); });
