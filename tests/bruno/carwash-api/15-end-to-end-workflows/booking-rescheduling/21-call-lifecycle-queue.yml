info:
  name: Call lifecycle reschedule queue entry
  type: http
  seq: 21
  tags: [workflow, staff]
http:
  method: POST
  url: "{{baseUrl}}/api/queue-entries/{{rescheduleLifecycleQueueId}}/call"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns CALLED", function() { expect(res.status).to.equal(200); expect(res.body.queueStatus).to.equal("CALLED"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
