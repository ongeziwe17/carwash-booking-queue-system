info:
  name: Create booking before service deactivation
  type: http
  seq: 14
  tags: [workflow, customer]
http:
  method: POST
  url: "{{baseUrl}}/api/bookings"
  headers: [{ name: Content-Type, value: "application/json" }]
  body:
    type: json
    data: |-
      {
        "bookingId": "{{rescheduleInactiveBookingId}}",
        "userId": "{{customerUserId}}",
        "vehicleId": "{{customerVehicleId}}",
        "serviceId": "{{rescheduleServiceId}}",
        "scheduledDateTime": "{{future41}}",
        "specialRequest": "inactive service reschedule"
      }
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("returns 201", function() { expect(res.status).to.equal(201); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
