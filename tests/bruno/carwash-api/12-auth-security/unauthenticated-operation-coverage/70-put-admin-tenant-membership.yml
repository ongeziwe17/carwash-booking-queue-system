info: { name: 401 PUT admin tenant membership, type: http, seq: 70, tags: [security, auth, tenant] }
http:
  method: PUT
  url: "{{baseUrl}}/api/admin/users/{{customerUserId}}/tenant-membership"
  headers: [{ name: Content-Type, value: application/json }]
  body: { type: json, data: '{"businessId":"{{opsBusinessId}}"}' }
  auth: { type: none }
runtime:
  scripts:
    - type: tests
      code: test("returns safe 401", function() { expect(res.status).to.equal(401); expect(res.body.code).to.equal("AUTHENTICATION_REQUIRED"); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
