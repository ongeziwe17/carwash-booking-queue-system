info:
  name: Reschedule rejects a past target time
  type: http
  seq: 9
  tags:
    - customer
    - validation

http:
  method: POST
  url: "{{baseUrl}}/api/bookings/{{bookingId}}/reschedule"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "scheduledDateTime": "{{pastDateTime}}"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns HTTP 400", function() { expect(res.status).to.equal(400); });
        test("uses the branch-timezone business rule", function() { expect(res.body.code).to.equal("BUSINESS_RULE_VIOLATION"); });
        test("reports the authoritative future rule", function() { expect(res.body.message).to.equal("Scheduled date/time must be in the future"); });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
