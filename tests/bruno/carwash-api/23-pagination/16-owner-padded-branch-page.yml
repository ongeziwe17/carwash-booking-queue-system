info: { name: Whitespace-padded business path keeps the canonical owner page, type: http, seq: 16, tags: [pagination, regression, marketplace] }
http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/businesses/%20{{marketplaceBusinessId}}%20/branches?sort=name,desc&sort=id,asc"
  auth: { type: bearer, token: "{{ownerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("padded path resolves the same owned branches", function() {
          expect(res.status).to.equal(200);
          expect(res.body.totalElements).to.equal(Number(bru.getVar("branchPaginationTotal")));
          expect(res.body.content.some(branch => branch.branchId === bru.getVar("marketplaceBranchId"))).to.equal(true);
          expect(res.body.content.every(branch => branch.businessId === bru.getVar("marketplaceBusinessId"))).to.equal(true);
        });
settings: { encodeUrl: false, timeout: 15000, followRedirects: false }
