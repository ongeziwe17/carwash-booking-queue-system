info:
  name: Foreign booking filter cannot reveal counts
  type: http
  seq: 11
  tags: [pagination, regression]
http:
  method: GET
  url: "{{baseUrl}}/api/bookings?userId=unavailable-foreign-user&page=100&size=1"
  auth: { type: bearer, token: "{{staffToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("status and pagination contract", function() {
          expect(res.status).to.equal(200);
          
          expect(res.body.content).to.deep.equal([]); expect(res.body.totalElements).to.equal(0); expect(res.body.page).to.equal(100);
        });
        test("no sensitive diagnostics", function() {
          const payload=JSON.stringify(res.body).toLowerCase();
          for(const forbidden of ["passwordhash", "encodedpassword", "stacktrace", "authorization", "java.lang"])
            expect(payload).to.not.include(forbidden);
        });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
