info:
  name: Allowed multiple sort terms with exact filter
  type: http
  seq: 2
  tags: [pagination, regression]
http:
  method: GET
  url: "{{baseUrl}}/api/services?id={{serviceId}}&sort=price,desc&sort=name,asc&size=100"
  auth: { type: bearer, token: "{{customerToken}}" }
runtime:
  scripts:
    - type: tests
      code: |-
        test("status and pagination contract", function() {
          expect(res.status).to.equal(200);

          expect(res.body.content.length).to.equal(1); expect(res.body.content[0].serviceId).to.equal(bru.getVar("serviceId")); expect(res.body.size).to.equal(100); expect(res.body.totalElements).to.equal(1);
        });
        test("no sensitive diagnostics", function() {
          const payload=JSON.stringify(res.body).toLowerCase();
          for(const forbidden of ["passwordhash", "encodedpassword", "stacktrace", "authorization", "java.lang"])
            expect(payload).to.not.include(forbidden);
        });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
