info: { name: Existing business with no branches has an empty page, type: http, seq: 14, tags: [pagination, regression, marketplace] }
http:
  method: GET
  url: "{{baseUrl}}/api/marketplace/businesses/pagination-empty-{{runId}}/branches"
  auth: { type: bearer, token: "{{adminToken}}" }
runtime:
  scripts:
    - type: tests
      code: test("empty business keeps default page metadata", function() { expect(res.status).to.equal(200); expect(res.body.content).to.deep.equal([]); expect(res.body.totalElements).to.equal(0); expect(res.body.totalPages).to.equal(0); expect(res.body.page).to.equal(0); expect(res.body.size).to.equal(20); });
settings: { encodeUrl: true, timeout: 15000, followRedirects: false }
