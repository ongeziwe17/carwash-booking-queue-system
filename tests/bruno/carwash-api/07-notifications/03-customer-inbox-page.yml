info:
  name: Customer reads first inbox page
  type: http
  seq: 3
  tags: [customer, notification, lifecycle]

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/user/{{customerUserId}}/inbox?limit=1"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns a bounded inbox page", function() { expect(res.status).to.equal(200); expect(res.body.notifications).to.be.an("array").with.length(1); });
        test("reports total unread and an opaque cursor", function() { expect(res.body.unreadCount).to.be.greaterThan(0); expect(res.body.nextCursor).to.be.a("string").and.not.empty; });
        const n = res.body.notifications[0];
        test("uses the privacy allowlist", function() { expect(n.userId).to.equal(bru.getVar("customerUserId")); expect(n.user).to.equal(undefined); expect(n.booking).to.equal(undefined); expect(n.password).to.equal(undefined); });
        bru.setVar("notificationReadId", n.notificationId);
        bru.setVar("notificationInboxCursor", res.body.nextCursor);
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
