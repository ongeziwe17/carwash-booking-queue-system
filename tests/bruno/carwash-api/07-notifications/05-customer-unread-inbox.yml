info:
  name: Customer filters unread inbox
  type: http
  seq: 5
  tags: [customer, notification, lifecycle]

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/user/{{customerUserId}}/inbox?unreadOnly=true&limit=10"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns unread notifications", function() { expect(res.status).to.equal(200); expect(res.body.notifications.every(n => n.deliveryStatus === "SENT" && n.readAt == null)).to.equal(true); });
        test("count covers at least the returned page", function() { expect(res.body.unreadCount).to.be.at.least(res.body.notifications.length); });
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
