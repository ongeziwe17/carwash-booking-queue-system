info:
  name: Customer marks one notification read
  type: http
  seq: 6
  tags: [customer, notification, lifecycle]

http:
  method: PUT
  url: "{{baseUrl}}/api/notifications/{{notificationReadId}}/read"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("transitions SENT to READ", function() { expect(res.status).to.equal(200); expect(res.body.deliveryStatus).to.equal("READ"); expect(res.body.readAt).to.be.a("string"); });
        test("returns only the recipient snapshot", function() { expect(res.body.userId).to.equal(bru.getVar("customerUserId")); expect(res.body.user).to.equal(undefined); expect(res.body.booking).to.equal(undefined); });
        bru.setVar("notificationOriginalReadAt", res.body.readAt);
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
