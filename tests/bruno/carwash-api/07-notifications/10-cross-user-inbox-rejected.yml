info:
  name: Customer cannot list another inbox
  type: http
  seq: 10
  tags: [customer, notification, security]

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/user/{{otherCustomerUserId}}/inbox"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 403", function() { expect(res.status).to.equal(403); expect(res.body.code).to.equal("ACCESS_DENIED"); });
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
