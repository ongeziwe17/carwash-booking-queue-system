info:
  name: liveness
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/actuator/health/liveness"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function() { expect(res.status).to.equal(200); });
        test("minimal healthy probe", function() { expect(res.body).to.deep.equal({status: "UP"}); });
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
