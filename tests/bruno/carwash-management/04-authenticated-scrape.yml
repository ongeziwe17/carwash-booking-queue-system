info:
  name: authenticated-scrape
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/actuator/prometheus"
  headers:
    - name: Authorization
      value: "Basic {{process.env.BRUNO_SCRAPE_BASIC}}"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function() { expect(res.status).to.equal(200); });
        test("Prometheus export", function() { expect(String(res.body)).to.include("jvm_memory_used_bytes"); });
settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: false
