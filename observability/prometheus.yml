global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: carwash
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    basic_auth:
      username: scraper
      password_file: /run/secrets/scrape_password
    static_configs:
      - targets: [carwash-api:8080]
  - job_name: carwash-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://carwash-api:8080/actuator/health/readiness]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
