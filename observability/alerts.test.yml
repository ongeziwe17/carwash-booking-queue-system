rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="carwash",instance="api"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: CarwashScrapeUnavailable
        exp_alerts:
          - exp_labels: {job: carwash, instance: api, severity: critical}
            exp_annotations:
              summary: Application telemetry scrape is unavailable
              description: Check process, reachability, scrape credentials and rotation before attributing this to application failure.
              runbook_url: https://github.com/ongeziwe17/carwash-booking-queue-system/blob/staging/documentation/OBSERVABILITY.md#alerts
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="carwash",uri="/api/bookings",status="500"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: CarwashHttpErrors
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="carwash",uri="/api/bookings",status="500"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: CarwashHttpErrors
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Business API server error rate exceeds five percent
              description: Inspect safe failure events, readiness and workflow outcomes; identify the failing route template.
              runbook_url: https://github.com/ongeziwe17/carwash-booking-queue-system/blob/staging/documentation/OBSERVABILITY.md#alerts
