name: CI-CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - develop

env:
  JDK_VERSION: 21

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Make mvnw executable
        run: chmod +x mvnw

      ## - name: Validate Docker Compose config
      ##  run: docker compose -f docker-compose.yml config

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_APPLICATION_NAME: carwash-booking-queue-system
          SERVER_PORT: 8080

          SECURE_PASSWORD_BCRYPT_STRENGTH: 10
          SECURE_PASSWORD_MIN_LENGTH: 12
          SECURE_PASSWORD_MAX_UTF8_BYTES: 72

          SECURE_JWT_ISSUER: carwash-booking-queue-system-ci
          SECURE_JWT_ACCESS_TOKEN_TTL: 20m
          SECURE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: ./mvnw clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar


  publish:
    name: Publish JAR
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: '*.jar'


  containerize:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build_test

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/staging' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/carwash-booking-queue-system
            ghcr.io/${{ github.repository_owner }}/carwash-booking-queue-system

          # Prevent semantic-version tags from automatically producing latest.
          flavor: |
            latest=false

          tags: |
            # Branch name:
            # staging
            # master
            type=ref,event=branch

            # Branch + commit date:
            # staging-20260804-021900
            type=raw,value={{branch}}-{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}},enable=${{ startsWith(github.ref, 'refs/heads/') }}

            # Semantic version from a Git tag:
            # v0.1.0
            type=semver,pattern={{raw}}

            # Version + commit date:
            # v0.1.0-20260804-021900
            type=raw,value={{tag}}-{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # Immutable commit tag:
            # sha-a1b2c3d
            type=sha,prefix=sha-

            # Only the default branch receives latest.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Display generated image tags
        run: |
          echo "Generated Docker tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
