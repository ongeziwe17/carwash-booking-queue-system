name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - staging
      - develop
      - master
  push:
    branches:
      - staging
      - develop
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JDK_VERSION: '21'
  LOCAL_IMAGE: carwash-booking-queue-system:ci-${{ github.sha }}

jobs:
  workflow-lint:
    name: Workflow syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate committed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git diff-tree --check --root -r "${GITHUB_SHA}"
          fi

      - name: Run actionlint
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          rhysd/actionlint:1.7.12

      - name: Validate publishing metadata templates
        shell: bash
        run: |
          set -euo pipefail

          expected_template="{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}}"
          template_count="$(
            grep --fixed-strings -- 'type=raw,value=' .github/workflows/ci-cd.yml \
              | grep --only-matching --fixed-strings -- "${expected_template}" \
              | wc -l
          )"

          if [[ "${template_count}" -ne 3 ]]; then
            echo "Expected three valid commit_date templates, found ${template_count}."
            exit 1
          fi

      - name: Audit test isolation patterns
        shell: bash
        run: |
          set -u
          echo '--- fixed short IDs ---'
          grep -R '"u1"\|"u2"\|"s1"\|"s2"\|"v1"\|"v2"\|"b1"\|"b2"' -n src/test || true
          echo '--- static repositories ---'
          grep -R "static.*Repository" -n src/test || true
          echo '--- static AtomicLong ---'
          grep -R "static.*AtomicLong" -n src/main src/test || true
          echo '--- explicit test ordering ---'
          grep -R "@Order" -n src/test || true
          echo '--- sleeps ---'
          grep -R "Thread.sleep" -n src/test || true
          echo '--- context resets ---'
          grep -R "@DirtiesContext" -n src/test || true
          echo '--- HashMap fixtures ---'
          grep -R "new HashMap" -n src/test || true
          echo '--- misplaced configuration reference ---'
          grep -R "api.dto.ApplicationServiceConfig" -n src || true

  maven-verification:
    name: Maven verification
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_APP_NAME: carwash-booking-queue-system
      SERVER_PORT: '8080'
      SECURE_PASSWORD_BCRYPT_STRENGTH: '4'
      SECURE_PASSWORD_MIN_LENGTH: '12'
      SECURE_PASSWORD_MAX_UTF8_BYTES: '72'
      SECURE_JWT_ISSUER: carwash-booking-queue-system-ci
      SECURE_JWT_ACCESS_TOKEN_TTL: 20m
      SECURE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SECURE_BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate required CI secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SECURE_JWT_SECRET}" ]]; then
            echo "CI_JWT_SECRET is not configured."
            exit 1
          fi

      - name: Run Maven verification
        run: ./mvnw --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-${{ github.run_number }}-${{ github.sha }}
          path: target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-jar-${{ github.run_number }}-${{ github.sha }}
          path: target/carwash-api.jar
          if-no-files-found: error
          retention-days: 14

      - name: Export OpenAPI document
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          log_file="target/openapi-export.log"
          java -jar target/carwash-api.jar >"${log_file}" 2>&1 &
          app_pid=$!

          trap 'kill "${app_pid}" 2>/dev/null || true; wait "${app_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8080/v3/api-docs \
              --output openapi.json; then
              exit 0
            fi

            if ! kill -0 "${app_pid}" 2>/dev/null; then
              echo "Application stopped before OpenAPI export completed."
              tail -n 100 "${log_file}" || true
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for the OpenAPI endpoint."
          tail -n 100 "${log_file}" || true
          exit 1

      - name: Upload OpenAPI artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-${{ github.run_number }}-${{ github.sha }}
          path: openapi.json
          if-no-files-found: error
          retention-days: 14

  postgres-verification:
    name: PostgreSQL migrations, durability and concurrency
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_APP_NAME: carwash-booking-queue-system
      SERVER_PORT: '8080'
      SECURE_PASSWORD_BCRYPT_STRENGTH: '4'
      SECURE_PASSWORD_MIN_LENGTH: '12'
      SECURE_PASSWORD_MAX_UTF8_BYTES: '72'
      SECURE_JWT_ISSUER: carwash-booking-queue-system-postgres-ci
      SECURE_JWT_ACCESS_TOKEN_TTL: 20m
      SECURE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SECURE_BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run PostgreSQL integration verification
        run: ./mvnw --batch-mode -Djacoco.skip=true -Dit.test=PostgresPersistenceIntegrationTest verify
      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-reports-${{ github.run_number }}-${{ github.sha }}
          path: target/failsafe-reports/**
          if-no-files-found: error
          retention-days: 14

  test-repeatability:
    name: Test repeatability (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 11001
          - 11002
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_APP_NAME: carwash-booking-queue-system
      SERVER_PORT: '8080'
      SECURE_PASSWORD_BCRYPT_STRENGTH: '4'
      SECURE_PASSWORD_MIN_LENGTH: '12'
      SECURE_PASSWORD_MAX_UTF8_BYTES: '72'
      SECURE_JWT_ISSUER: carwash-booking-queue-system-ci
      SECURE_JWT_ACCESS_TOKEN_TTL: 20m
      SECURE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SECURE_BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate required CI secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SECURE_JWT_SECRET}" ]]; then
            echo "CI_JWT_SECRET is not configured."
            exit 1
          fi

      - name: Run complete verification with recorded seed
        run: ./mvnw --batch-mode -Dtest.order.seed=${{ matrix.seed }} clean verify

      - name: Upload failing seed reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-repeatability-seed-${{ matrix.seed }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  isolated-test-selection:
    name: Selected test isolation
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_APP_NAME: carwash-booking-queue-system
      SERVER_PORT: '8080'
      SECURE_PASSWORD_BCRYPT_STRENGTH: '4'
      SECURE_PASSWORD_MIN_LENGTH: '12'
      SECURE_PASSWORD_MAX_UTF8_BYTES: '72'
      SECURE_JWT_ISSUER: carwash-booking-queue-system-ci
      SECURE_JWT_ACCESS_TOKEN_TTL: 20m
      SECURE_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SECURE_BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate required CI secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SECURE_JWT_SECRET}" ]]; then
            echo "CI_JWT_SECRET is not configured."
            exit 1
          fi

      - name: Run focused service test
        run: ./mvnw --batch-mode -Dtest=UserManagementServiceTest test

      - name: Run booking integration test independently
        run: ./mvnw --batch-mode -Djacoco.skip=true -Dit.test=BookingWorkflowIntegrationTest verify

      - name: Run RBAC integration test independently
        run: ./mvnw --batch-mode -Djacoco.skip=true -Dit.test=RbacAuthorizationIntegrationTest verify

      - name: Upload selected-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selected-test-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - maven-verification
    env:
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

      - name: Validate Docker ignore rules
        shell: bash
        run: |
          set -euo pipefail

          for required_rule in '.env' '.env.*' '!.env.example'; do
            if ! grep --fixed-strings --line-regexp --quiet -- "${required_rule}" .dockerignore; then
              echo "Missing required .dockerignore rule: ${required_rule}"
              exit 1
            fi
          done

          if grep --fixed-strings --line-regexp --quiet -- '!.env' .dockerignore; then
            echo "The real .env file must not be re-included in the Docker context."
            exit 1
          fi

      - name: Create temporary Compose environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CI_JWT_SECRET}" ]]; then
            echo "CI_JWT_SECRET is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          template = Path('.env.example').read_text(encoding='utf-8')
          placeholder = 'REPLACE_WITH_BASE64_ENCODED_32_BYTE_SECRET'
          database_placeholder = 'REPLACE_WITH_LOCAL_DATABASE_PASSWORD'
          secret = os.environ['CI_JWT_SECRET']

          if placeholder not in template:
              raise SystemExit('JWT placeholder was not found in .env.example')
          if database_placeholder not in template:
              raise SystemExit('Database password placeholder was not found in .env.example')

          Path('.env').write_text(
              template.replace(placeholder, secret, 1).replace(
                  database_placeholder, secrets.token_urlsafe(32)),
              encoding='utf-8',
          )
          PY

      - name: Verify .env is ignored by Git
        run: git check-ignore -v .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime user
        shell: bash
        run: |
          set -euo pipefail
          image_user="$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Config.User}}')"

          case "${image_user}" in
            ''|root|0|0:0)
              echo "Docker image must run as a non-root user. Found: '${image_user}'"
              exit 1
              ;;
            *)
              echo "Runtime user: ${image_user}"
              ;;
          esac

      - name: Inspect Docker image history
        shell: bash
        run: |
          set -euo pipefail
          image_history="$(docker history --no-trunc "${LOCAL_IMAGE}")"
          printf '%s\n' "${image_history}"

          if grep --extended-regexp --ignore-case \
            'SECURE_JWT_SECRET|SECURE_BOOTSTRAP_ADMIN_PASSWORD|POSTGRES_PASSWORD|SPRING_DATASOURCE_PASSWORD|COPY[[:space:]]+\.env' \
            <<<"${image_history}"; then
            echo "Docker image history contains a forbidden secret or .env reference."
            exit 1
          fi

      - name: Start persistent-profile Compose stack and verify restart recovery
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach --build --wait
          for _ in {1..40}; do
            if curl --silent --show-error --fail http://127.0.0.1:8080/v3/api-docs --output /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:8080/v3/api-docs --output /dev/null
          docker compose restart carwash-api
          for _ in {1..40}; do
            if curl --silent --show-error --fail http://127.0.0.1:8080/v3/api-docs --output /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Compose API did not recover after restart."
          exit 1

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail

          container_name="carwash-api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          trap 'docker logs "${container_name}" || true; docker rm --force "${container_name}" || true' EXIT

          docker run --detach \
            --name "${container_name}" \
            --publish 18080:8080 \
            --env SPRING_PROFILES_ACTIVE=test \
            --env SPRING_APP_NAME=carwash-booking-queue-system \
            --env SERVER_PORT=8080 \
            --env SECURE_PASSWORD_BCRYPT_STRENGTH=4 \
            --env SECURE_PASSWORD_MIN_LENGTH=12 \
            --env SECURE_PASSWORD_MAX_UTF8_BYTES=72 \
            --env SECURE_JWT_ISSUER=carwash-booking-queue-system-ci \
            --env SECURE_JWT_ACCESS_TOKEN_TTL=20m \
            --env SECURE_JWT_SECRET="${CI_JWT_SECRET}" \
            --env SECURE_BOOTSTRAP_ADMIN_ENABLED=false \
            "${LOCAL_IMAGE}"

          for _ in {1..30}; do
            if curl --silent --show-error --fail \
              http://127.0.0.1:18080/v3/api-docs \
              --output /dev/null; then
              exit 0
            fi

            if ! docker inspect --format '{{.State.Running}}' "${container_name}" \
              | grep --quiet true; then
              echo "Smoke-test container stopped before becoming ready."
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for the smoke-test container."
          exit 1

      - name: Generate vulnerability baseline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Enforce fixed critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ github.run_number }}-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Compose stack and remove ephemeral CI data
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env

  publish-container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - maven-verification
      - postgres-verification
      - test-repeatability
      - isolated-test-selection
      - docker-validation
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/staging' ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag provenance
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/master; then
            echo "Release tag '${GITHUB_REF_NAME}' must point to a commit reachable from master."
            exit 1
          fi

          echo "Release tag '${GITHUB_REF_NAME}' points to master-reachable commit ${tag_commit}."

      - name: Validate Docker Hub publishing secrets
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKER_USERNAME}" || -z "${DOCKER_PASSWORD}" ]]; then
            echo "DOCKER_USERNAME and DOCKER_PASSWORD must be configured for publishing."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/carwash-booking-queue-system
            ghcr.io/${{ github.repository_owner }}/carwash-booking-queue-system
          flavor: latest=false
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=staging-{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}},enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=develop-{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.ref_name }}-{{commit_date 'YYYYMMDD-HHmmss' tz='Africa/Johannesburg'}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short

      - name: Review generated image tags
        env:
          GENERATED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: printf '%s\n' "${GENERATED_TAGS}"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
