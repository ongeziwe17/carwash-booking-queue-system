name: Reference Kubernetes deployment

on:
  pull_request:
    branches: [staging, develop, master]
  push:
    branches: [staging, develop, master]

permissions:
  contents: read

concurrency:
  group: reference-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      LOCAL_IMAGE: hlambaq-api:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Create disposable pinned Kubernetes cluster and local registry
        id: kind
        uses: helm/kind-action@92086f6be054225fa813e0a4b13787fc9088faab # v1.13.0
        with:
          version: v0.31.0
          kubectl_version: v1.31.14
          node_image: kindest/node:v1.31.14@sha256:6f86cf509dbb42767b6e79debc3f2c32e4ee01386f0489b3b2be24b0a55aac2b
          registry: true
          registry_image: registry:2.8.3
          wait: 120s
      - name: Render and validate reference resources
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.2 bcrypt==4.2.1
          mkdir -p target/deployment
          kubectl kustomize deployment/kubernetes/base > target/deployment/base.yaml
          python3 tools/validate-deployment.py target/deployment/base.yaml
          kubectl kustomize deployment/kubernetes/staging > target/deployment/staging.yaml
          python3 tools/validate-deployment.py target/deployment/staging.yaml --profile=staging
      - name: Build, scan and publish two disposable image revisions
        env:
          REGISTRY: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
        run: |
          set -euo pipefail
          test -n "${REGISTRY}"
          for revision in one two; do
            docker build --label "ci.reference.revision=${revision}" -t "${LOCAL_IMAGE}-${revision}" .
            test "$(docker image inspect "${LOCAL_IMAGE}-${revision}" --format '{{.Config.User}}')" = '10001:10001'
            docker image inspect "${LOCAL_IMAGE}-${revision}" --format '{{json .Config.Env}}' | grep --quiet -- 'MaxRAMPercentage=55.0'
            image="${REGISTRY}/hlambaq-api:${GITHUB_SHA}-${revision}"
            docker tag "${LOCAL_IMAGE}-${revision}" "${image}"
            push_output="$(docker push "${image}")"
            digest="$(printf '%s\n' "${push_output}" | sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' | tail -n 1)"
            test -n "${digest}"
            printf '%s@%s\n' "${REGISTRY}/hlambaq-api" "${digest}" > "target/deployment/image-${revision}"
          done
          docker history --no-trunc "${LOCAL_IMAGE}-one" > target/deployment/image-history.txt
          if grep -Ei 'SECURE_JWT_SECRET|SECURE_BOOTSTRAP_ADMIN_PASSWORD|POSTGRES_PASSWORD|SPRING_DATASOURCE_PASSWORD|COPY[[:space:]]+\.env' target/deployment/image-history.txt; then
            echo 'Unexpected credential reference in image history'
            exit 1
          fi
      - name: Reject production without a durable database
        run: |
          set -euo pipefail
          if docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --cap-drop ALL --security-opt no-new-privileges \
              --env SPRING_PROFILES_ACTIVE=production \
              --env SPRING_APP_NAME=carwash-booking-queue-system \
              --env SERVER_PORT=8080 \
              "${LOCAL_IMAGE}-one" > target/deployment/invalid-profile.log 2>&1; then
            echo 'Unsafe in-memory production startup unexpectedly succeeded'
            exit 1
          fi
          grep --quiet 'DeploymentProfileGuard' target/deployment/invalid-profile.log
      - name: Prepare ephemeral PostgreSQL and external secret
        run: |
          set -euo pipefail
          test -n "${CI_JWT_SECRET}"
          kubectl apply -f deployment/kubernetes/base/namespace.yaml
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          import bcrypt
          target = Path('target/deployment/runtime.env')
          target.write_text('\n'.join((
              'db-url=jdbc:postgresql://ci-postgres.hlambaq.svc.cluster.local:5432/carwash',
              'db-user=carwash',
              'db-password=' + secrets.token_urlsafe(30),
              'jwt-secret=' + os.environ['CI_JWT_SECRET'],
              'scrape-user=ci-scrape',
              'scrape-hash={bcrypt}' + bcrypt.hashpw(secrets.token_urlsafe(20).encode(), bcrypt.gensalt()).decode(),
          )) + '\n')
          target.chmod(0o600)
          PY
          kubectl -n hlambaq create secret generic hlambaq-runtime --from-env-file=target/deployment/runtime.env
          kubectl apply -f deployment/kubernetes/ci/postgres.yaml
          kubectl -n hlambaq rollout status deployment/ci-postgres --timeout=180s
      - name: Server-validate and start the production-profile reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path('target/deployment/base.yaml').read_text()
          placeholder = 'ghcr.io/ongeziwe17/carwash-booking-queue-system@sha256:' + '0' * 64
          assert base.count(placeholder) == 1
          Path('target/deployment/rendered.yaml').write_text(
              base.replace(placeholder, Path('target/deployment/image-one').read_text().strip()))
          PY
          python3 tools/validate-deployment.py target/deployment/rendered.yaml --real-digest
          kubectl apply --dry-run=server --validate=strict -f target/deployment/rendered.yaml > /dev/null
          kubectl apply -f target/deployment/rendered.yaml
          kubectl -n hlambaq rollout status deployment/hlambaq-api --timeout=360s
          test "$(kubectl -n hlambaq get deployment hlambaq-api -o jsonpath='{.status.readyReplicas}')" = 2
      - name: Verify readiness, liveness, and database outage isolation
        run: |
          set -euo pipefail
          pod="$(kubectl -n hlambaq get pods -l app.kubernetes.io/name=hlambaq-api -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n hlambaq port-forward "pod/${pod}" 18080:8080 > target/deployment/port-forward.log 2>&1 &
          port_pid=$!
          trap 'kill "${port_pid}" 2>/dev/null || true' EXIT
          for ((attempt=1; attempt<=30; attempt++)); do
            if curl --silent --fail http://127.0.0.1:18080/actuator/health/readiness > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18080/actuator/health/liveness > /dev/null
          curl --silent --dump-header target/deployment/headers.txt --output /dev/null \
            -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: untrusted.example.invalid' \
            http://127.0.0.1:18080/actuator/health/liveness
          grep -qi 'x-content-type-options: nosniff' target/deployment/headers.txt
          grep -qi 'x-frame-options: DENY' target/deployment/headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v3/api-docs)" = 403 ||
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v3/api-docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/actuator/prometheus)" = 401
          kubectl -n hlambaq scale deployment/ci-postgres --replicas=0
          kubectl -n hlambaq rollout status deployment/ci-postgres --timeout=90s
          unhealthy=false
          for ((attempt=1; attempt<=35; attempt++)); do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:18080/actuator/health/readiness || true)"
            if [[ "${status}" == 503 ]]; then unhealthy=true; break; fi
            sleep 2
          done
          test "${unhealthy}" = true
          curl --silent --fail http://127.0.0.1:18080/actuator/health/liveness > /dev/null
          kubectl -n hlambaq scale deployment/ci-postgres --replicas=1
          kubectl -n hlambaq rollout status deployment/ci-postgres --timeout=180s
          for ((attempt=1; attempt<=45; attempt++)); do
            if curl --silent --fail --max-time 8 http://127.0.0.1:18080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Application readiness did not recover after database restoration'
          exit 1
      - name: Ensure runtime logs do not contain provisioned credentials
        run: |
          set -euo pipefail
          kubectl -n hlambaq logs -l app.kubernetes.io/name=hlambaq-api --tail=500 > target/deployment/runtime.log
          if grep --fixed-strings --quiet "${CI_JWT_SECRET}" target/deployment/runtime.log; then
            echo 'JWT credential appeared in runtime logs'
            exit 1
          fi
      - name: Exercise rolling replacement and compatible-image rollback
        run: |
          set -euo pipefail
          before="$(cat target/deployment/image-one)"
          after="$(cat target/deployment/image-two)"
          test "${before}" != "${after}"
          kubectl -n hlambaq set image deployment/hlambaq-api "api=${after}"
          kubectl -n hlambaq rollout status deployment/hlambaq-api --timeout=360s
          test "$(kubectl -n hlambaq get deployment hlambaq-api -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl -n hlambaq rollout undo deployment/hlambaq-api
          kubectl -n hlambaq rollout status deployment/hlambaq-api --timeout=360s
          test "$(kubectl -n hlambaq get deployment hlambaq-api -o jsonpath='{.spec.template.spec.containers[0].image}')" = "${before}"
          test "$(kubectl -n hlambaq get deployment hlambaq-api -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl -n hlambaq set env deployment/hlambaq-api SPRING_PROFILES_ACTIVE=staging
          kubectl -n hlambaq rollout status deployment/hlambaq-api --timeout=360s
          test "$(kubectl -n hlambaq get deployment hlambaq-api -o jsonpath='{.status.readyReplicas}')" = 2
      - name: Diagnose disposable deployment on failure
        if: failure()
        run: |
          kubectl -n hlambaq get pods,deployments,services,pdb -o wide || true
          kubectl -n hlambaq describe deployment hlambaq-api || true
      - name: Remove ephemeral secret files
        if: always()
        run: rm -f target/deployment/runtime.env
