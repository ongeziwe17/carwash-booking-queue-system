spring.application.name=${SPRING_APP_NAME}
server.port=${SERVER_PORT}
carwash.security.password.bcrypt-strength=${SECURE_PASSWORD_BCRYPT_STRENGTH}
carwash.security.password.min-length=${SECURE_PASSWORD_MIN_LENGTH}
carwash.security.password.max-utf8-bytes=${SECURE_PASSWORD_MAX_UTF8_BYTES}
carwash.security.jwt.issuer=${SECURE_JWT_ISSUER}
carwash.security.jwt.access-token-ttl=${SECURE_JWT_ACCESS_TOKEN_TTL}
carwash.security.jwt.secret=${SECURE_JWT_SECRET}
carwash.security.bootstrap-admin.enabled=${SECURE_BOOTSTRAP_ADMIN_ENABLED:false}
carwash.security.bootstrap-admin.user-id=${SECURE_BOOTSTRAP_ADMIN_USER_ID:}
carwash.security.bootstrap-admin.full-name=${SECURE_BOOTSTRAP_ADMIN_FULL_NAME:}
carwash.security.bootstrap-admin.email=${SECURE_BOOTSTRAP_ADMIN_EMAIL:}
carwash.security.bootstrap-admin.phone=${SECURE_BOOTSTRAP_ADMIN_PHONE:}
carwash.security.bootstrap-admin.password=${SECURE_BOOTSTRAP_ADMIN_PASSWORD:}
carwash.policy.booking.max-active-bookings-per-slot=${CARWASH_BOOKING_MAX_ACTIVE_PER_SLOT:1}
carwash.policy.booking.cancellation-window=${CARWASH_BOOKING_CANCELLATION_WINDOW:PT0S}
carwash.policy.booking.operating-start=${CARWASH_BOOKING_OPERATING_START:08:00}
carwash.policy.booking.operating-end=${CARWASH_BOOKING_OPERATING_END:17:00}
carwash.policy.booking.slot-interval=${CARWASH_BOOKING_SLOT_INTERVAL:PT30M}
carwash.policy.notification.recent-limit=${CARWASH_NOTIFICATION_RECENT_LIMIT:10}
carwash.policy.queue.default-service-duration=${CARWASH_QUEUE_DEFAULT_SERVICE_DURATION:PT10M}
carwash.runtime.time-zone=${CARWASH_TIME_ZONE:UTC}

spring.jackson.deserialization.fail-on-unknown-properties=true
