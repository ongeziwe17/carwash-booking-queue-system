apiVersion: v1
kind: ConfigMap
metadata:
  name: hlambaq-api-config
data:
  SPRING_PROFILES_ACTIVE: production
  SPRING_APP_NAME: carwash-booking-queue-system
  SERVER_PORT: "8080"
  SECURE_PASSWORD_BCRYPT_STRENGTH: "10"
  SECURE_PASSWORD_MIN_LENGTH: "12"
  SECURE_PASSWORD_MAX_UTF8_BYTES: "72"
  SECURE_JWT_ISSUER: hlambaq
  SECURE_JWT_ACCESS_TOKEN_TTL: 20m
  SECURE_BOOTSTRAP_ADMIN_ENABLED: "false"
  SPRING_DATASOURCE_MAX_POOL_SIZE: "10"
  SPRING_DATASOURCE_MIN_IDLE: "2"
  SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS: "3000"
  CARWASH_TRACE_SAMPLE_PROBABILITY: "0.1"
