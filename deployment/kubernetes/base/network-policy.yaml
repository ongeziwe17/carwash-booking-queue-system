apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hlambaq-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hlambaq-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hlambaq-access: gateway
        - namespaceSelector:
            matchLabels:
              hlambaq-access: monitoring
      ports:
        - protocol: TCP
          port: 8080
