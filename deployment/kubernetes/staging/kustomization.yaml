apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hlambaq-staging
resources:
  - ../base
patches:
  - target:
      kind: Namespace
      name: hlambaq
    patch: |-
      - op: replace
        path: /metadata/name
        value: hlambaq-staging
  - target:
      kind: ConfigMap
      name: hlambaq-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging
