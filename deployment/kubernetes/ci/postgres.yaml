# Disposable CI fixture only. This emptyDir database is not a production deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-postgres
  namespace: hlambaq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-postgres
  template:
    metadata:
      labels:
        app: ci-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine3.22
          env:
            - name: POSTGRES_DB
              value: carwash
            - name: POSTGRES_USER
              value: carwash
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hlambaq-runtime
                  key: db-password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, carwash, -d, carwash]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ci-postgres
  namespace: hlambaq
spec:
  selector:
    app: ci-postgres
  ports:
    - port: 5432
      targetPort: 5432
