services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-carwash}"
      POSTGRES_USER: "${POSTGRES_USER:-carwash}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carwash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  carwash-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: carwash-booking-queue-system:local
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carwash}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-carwash}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SPRING_DATASOURCE_MAX_POOL_SIZE: "${SPRING_DATASOURCE_MAX_POOL_SIZE:-20}"
      SPRING_DATASOURCE_MIN_IDLE: "${SPRING_DATASOURCE_MIN_IDLE:-2}"
      SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS: "${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:-30000}"
      CARWASH_RECOMMENDATION_WEIGHT_DISTANCE: "${CARWASH_RECOMMENDATION_WEIGHT_DISTANCE:-0.25}"
      CARWASH_RECOMMENDATION_WEIGHT_QUEUE_WAIT: "${CARWASH_RECOMMENDATION_WEIGHT_QUEUE_WAIT:-0.25}"
      CARWASH_RECOMMENDATION_WEIGHT_TOTAL_TIME: "${CARWASH_RECOMMENDATION_WEIGHT_TOTAL_TIME:-0.25}"
      CARWASH_RECOMMENDATION_WEIGHT_PRICE: "${CARWASH_RECOMMENDATION_WEIGHT_PRICE:-0.25}"
      CARWASH_RECOMMENDATION_MAX_RADIUS_KM: "${CARWASH_RECOMMENDATION_MAX_RADIUS_KM:-50.00}"
      CARWASH_NOTIFICATION_RECENT_LIMIT: "${CARWASH_NOTIFICATION_RECENT_LIMIT:-10}"
      CARWASH_NOTIFICATION_INBOX_DEFAULT_PAGE_SIZE: "${CARWASH_NOTIFICATION_INBOX_DEFAULT_PAGE_SIZE:-20}"
      CARWASH_NOTIFICATION_INBOX_MAXIMUM_PAGE_SIZE: "${CARWASH_NOTIFICATION_INBOX_MAXIMUM_PAGE_SIZE:-100}"
      CARWASH_AUDIT_RETENTION_PERIOD: "${CARWASH_AUDIT_RETENTION_PERIOD:-P365D}"
      CARWASH_AUDIT_DEFAULT_PAGE_SIZE: "${CARWASH_AUDIT_DEFAULT_PAGE_SIZE:-50}"
      CARWASH_AUDIT_MAXIMUM_PAGE_SIZE: "${CARWASH_AUDIT_MAXIMUM_PAGE_SIZE:-200}"
      CARWASH_AUDIT_MAXIMUM_QUERY_RANGE: "${CARWASH_AUDIT_MAXIMUM_QUERY_RANGE:-P90D}"
      CARWASH_AUDIT_METADATA_MAXIMUM_KEYS: "${CARWASH_AUDIT_METADATA_MAXIMUM_KEYS:-10}"
      CARWASH_AUDIT_METADATA_MAXIMUM_KEY_LENGTH: "${CARWASH_AUDIT_METADATA_MAXIMUM_KEY_LENGTH:-32}"
      CARWASH_AUDIT_METADATA_MAXIMUM_VALUE_LENGTH: "${CARWASH_AUDIT_METADATA_MAXIMUM_VALUE_LENGTH:-256}"
      CARWASH_AUDIT_METADATA_MAXIMUM_TOTAL_SIZE: "${CARWASH_AUDIT_METADATA_MAXIMUM_TOTAL_SIZE:-2048}"
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

volumes:
  carwash-postgres-data:
